name: CI/CD Pipeline - Test & Deploy n8n Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate Workflows & Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Workflow JSON files
        run: |
          echo "Validating workflow JSON files..."
          for file in workflows/*.json; do
            if [ -f "$file" ]; then
              python3 -m json.tool "$file" > /dev/null || exit 1
              echo "Valid JSON: $file"
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry run test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: n8n-automation:test

  deploy-notify:
    name: Trigger Render Deploy Hook (Optional)
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Call Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render auto-deploy..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
